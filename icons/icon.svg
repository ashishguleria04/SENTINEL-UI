<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid Hexagon Base (Dark with thick neon green border) -->
  <polygon points="50,5 92,27 92,73 50,95 8,73 8,27" fill="#0a0a0a" stroke="#00ff41" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Cyan Inner Circuit Traces -->
  <polygon points="50,18 76,33 76,67 50,82 24,67 24,33" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Circuit Nodes -->
  <circle cx="50" cy="18" r="4" fill="#00ff41" />
  <circle cx="50" cy="82" r="4" fill="#00ff41" />
  <circle cx="76" cy="33" r="4" fill="#00e5ff" />
  <circle cx="24" cy="33" r="4" fill="#00e5ff" />
  <circle cx="76" cy="67" r="4" fill="#00e5ff" />
  <circle cx="24" cy="67" r="4" fill="#00e5ff" />

  <!-- Thick, bold S for perfect visibility even at 16x16 pixels -->
  <path d="M 64 36 L 36 36 L 36 50 L 64 50 L 64 64 L 36 64" fill="none" stroke="#00ff41" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" />
</svg>
