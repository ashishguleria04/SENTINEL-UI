<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon / Cyber Shield Base -->
  <polygon points="50,5 92,27 92,73 50,95 8,73 8,27" fill="#030303" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inner Circuit Traces -->
  <polygon points="50,16 78,32 78,68 50,84 22,68 22,32" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Circuit Nodes -->
  <circle cx="50" cy="16" r="2.5" fill="#00ff41" />
  <circle cx="50" cy="84" r="2.5" fill="#00ff41" />
  <circle cx="78" cy="32" r="2.5" fill="#00e5ff" />
  <circle cx="22" cy="32" r="2.5" fill="#00e5ff" />
  <circle cx="78" cy="68" r="2.5" fill="#00e5ff" />
  <circle cx="22" cy="68" r="2.5" fill="#00e5ff" />

  <!-- Geometric Glowing "S" -->
  <path d="M 64 36 L 36 36 L 36 50 L 64 50 L 64 64 L 36 64" fill="none" stroke="url(#cyberGradient)" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  
  <!-- Decorative Tech Details -->
  <path d="M 42 26 L 58 26" stroke="#00ff41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 42 74 L 58 74" stroke="#00ff41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 15 50 L 25 50" stroke="#00ff41" stroke-width="1.5" opacity="0.4"/>
  <path d="M 75 50 L 85 50" stroke="#00ff41" stroke-width="1.5" opacity="0.4"/>
</svg>
