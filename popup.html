<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL - UI</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <img src="icons/icon.svg" alt="Sentinel Logo" class="logo">
                <h1>SENTINEL</h1>
            </div>
            <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
        </header>

        <main id="main-view">
            <div class="status-banner" id="status-banner">
                <div class="spinner hidden" id="status-spinner"></div>
                <span id="status-text">Checking Autonomous Scan Results...</span>
            </div>

            <div id="results" class="hidden">
                <div class="scanned-url-display">
                    <span id="current-scanned-url"></span>
                </div>

                <div class="ai-section">
                    <button id="ai-analyze-btn" class="magic-btn">✨ Generate AI Security Insights</button>
                    <div id="ai-insight-box" class="hidden">
                        <p id="ai-insight-text"></p>
                    </div>
                </div>

                <ul id="vulnerability-list">
                    <!-- Results injected here -->
                </ul>
            </div>
            
            <div id="no-results" class="hidden">
                <p>No results yet. Please reload the current web page to trigger the autonomous heuristic engine.</p>
            </div>
        </main>

        <main id="settings-view" class="hidden">
            <h2>Settings</h2>
            <div class="input-group">
                <label for="ai-key">Google Gemini API Key</label>
                <input type="password" id="ai-key" placeholder="AIzaSy...">
                <p class="help-text">Used to power the "AI Security Insights". Generate a key in Google AI Studio.</p>
            </div>
            <div class="button-group">
                <button id="save-settings-btn" class="primary-btn">Save</button>
                <button id="back-btn" class="secondary-btn">Back</button>
            </div>
        </main>

        <footer>
            <p>Superficial autonomous scan — not a penetration test</p>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
